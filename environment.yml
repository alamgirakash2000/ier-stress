# conda env create -f environment.yml
# Installs the exact package versions of every result (requirements-lock.txt). The torch build is CUDA 12.8 and
# runs on any NVIDIA driver that supports CUDA 12.8 or newer.
name: ierstress
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - -r requirements-lock.txt
